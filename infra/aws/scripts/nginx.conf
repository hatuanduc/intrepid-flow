# /etc/nginx/sites-available/intrepid
# Template — deploy bằng setup-nginx.sh (thay __WEB_DOMAIN__ / __API_DOMAIN__ theo env)
#
# Kiến trúc: Browser → Cloudflare (proxy, SSL mode: Full strict)
#                    → nginx :443 (Cloudflare Origin CA cert)
#                    → web :3000 / api :4000 (docker, localhost)
#
# SSL: Cloudflare Origin CA cert (15 năm, không cần renew) tại /etc/ssl/cloudflare/
#      — KHÔNG dùng certbot. Cert này chỉ được Cloudflare tin, không dùng cho truy cập trực tiếp.

# ── Restore real visitor IP từ Cloudflare ──────────────────────────────────
# Cloudflare proxy che IP thật của visitor — lấy lại qua header CF-Connecting-IP,
# chỉ tin header này khi request đến từ dải IP Cloudflare (https://www.cloudflare.com/ips/)
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;

# ── HTTP :80 → redirect HTTPS ──────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name __WEB_DOMAIN__ __API_DOMAIN__;
    return 301 https://$host$request_uri;
}

# ── Web (Next.js :3000) ────────────────────────────────────────────────────
server {
    # `listen ... http2` (thay vì `http2 on;`) — Ubuntu 24.04 ship nginx 1.24,
    # directive `http2` riêng chỉ có từ 1.25.1
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name __WEB_DOMAIN__;

    ssl_certificate     /etc/ssl/cloudflare/origin.pem;
    ssl_certificate_key /etc/ssl/cloudflare/origin.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection $http_connection;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

# ── API (NestJS :4000) ─────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name __API_DOMAIN__;

    ssl_certificate     /etc/ssl/cloudflare/origin.pem;
    ssl_certificate_key /etc/ssl/cloudflare/origin.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Upload file (reconcile...) — Cloudflare free plan cap 100MB/request
    client_max_body_size 100m;

    location / {
        proxy_pass         http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # SSE / streaming support
        proxy_buffering    off;
        proxy_read_timeout 300s;
    }
}
