x-log-opts: &log-opts
  awslogs-region: ap-southeast-1
  awslogs-group: /intrepid-flow/${APP_ENV}
  awslogs-create-group: "true"

services:
  db:
    image: postgres:16-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: intrepid
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: intrepid
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U intrepid"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging:
      driver: awslogs
      options:
        <<: *log-opts
        awslogs-stream: db
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging:
      driver: awslogs
      options:
        <<: *log-opts
        awslogs-stream: redis
    restart: unless-stopped

  migrate:
    image: intrepid-api
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    # No migration history exists yet in this project (local dev has always used
    # `db push`) — mirror that here instead of `migrate deploy`, which is a no-op
    # without migration files and left prod/dev with an empty schema.
    # The backfill after db:push is a one-time-effect, idempotent data fix (see the
    # .sql file) folded into the normal deploy so it never needs a manual DB step.
    command: ["sh", "-c", "pnpm db:push && npx prisma db execute --schema=prisma/schema.prisma --file=prisma/backfill-job-ids.sql"]
    environment:
      DATABASE_URL: postgresql://intrepid:${DB_PASSWORD}@db:5432/intrepid
      # SEED_ADMIN_PASSWORD chỉ cần khi chạy seed thủ công (`docker compose run --rm migrate pnpm db:seed`)
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD}
      # CloudWatch doesn't render ANSI color codes — Nest/Prisma CLI colorize by default.
      NO_COLOR: "1"
    depends_on:
      db:
        condition: service_healthy
    logging:
      driver: awslogs
      options:
        <<: *log-opts
        awslogs-stream: migrate
    restart: "no"

  api:
    image: intrepid-api
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "4000:4000"
    environment:
      DATABASE_URL: postgresql://intrepid:${DB_PASSWORD}@db:5432/intrepid
      JWT_SECRET: ${JWT_SECRET}
      PORT: 4000
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_FROM: ${SMTP_FROM}
      APP_URL: ${APP_URL}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      AWS_REGION: ${AWS_REGION}
      RECONCILE_BUCKET: ${RECONCILE_BUCKET}
      RECONCILE_LAMBDA_NAME: ${RECONCILE_LAMBDA_NAME}
      BANK_STATEMENT_PDF_BUCKET: ${BANK_STATEMENT_PDF_BUCKET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      # CloudWatch doesn't render ANSI color codes — Nest's ConsoleLogger colorizes by default.
      NO_COLOR: "1"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:4000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    logging:
      driver: awslogs
      options:
        <<: *log-opts
        awslogs-stream: api
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3000 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    logging:
      driver: awslogs
      options:
        <<: *log-opts
        awslogs-stream: web
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    environment:
      DATABASE_URL: postgresql://intrepid:${DB_PASSWORD}@db:5432/intrepid
      REDIS_HOST: redis
      REDIS_PORT: 6379
      APP_URL: ${APP_URL}
      # For DriveService's S3 mirror upload (see s3-bank-statement-pdfs.tf) — the worker
      # itself never touched AWS before this feature, api's block above is the only
      # precedent for these two vars.
      AWS_REGION: ${AWS_REGION}
      BANK_STATEMENT_PDF_BUCKET: ${BANK_STATEMENT_PDF_BUCKET}
      # Headed Chrome (via Xvfb, see worker Dockerfile) avoids Akamai's headless-Chromium
      # fingerprint check on HSBCnet's login page — plain headless gets served a
      # "Service Unavailable" WAF block page instead of the real login form.
      PLAYWRIGHT_HEADLESS: "false"
      # headless:false defaults slowMo to 600ms (meant for a human watching locally) —
      # nothing watches the Xvfb virtual display on EC2, so keep it off.
      PLAYWRIGHT_SLOW_MO: "0"
      # CloudWatch doesn't render ANSI color codes — Nest's ConsoleLogger colorizes by default.
      NO_COLOR: "1"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    logging:
      driver: awslogs
      options:
        <<: *log-opts
        awslogs-stream: worker
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
