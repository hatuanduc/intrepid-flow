services:
  db:
    image: postgres:16-alpine
    container_name: intrepid_db
    environment:
      POSTGRES_USER: intrepid
      POSTGRES_PASSWORD: intrepid
      POSTGRES_DB: intrepid
    ports:
      - "5433:5432"
    volumes:
      - intrepid_db_data:/var/lib/postgresql/data

volumes:
  intrepid_db_data:
