name: intrepid

services:
  db:
    image: postgres:16-alpine
    container_name: intrepid_db
    environment:
      POSTGRES_USER: intrepid
      POSTGRES_PASSWORD: intrepid
      POSTGRES_DB: intrepid
    ports:
      - "5433:5432"
    volumes:
      - intrepid_db_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: intrepid_redis
    ports:
      - "6379:6379"
    volumes:
      - intrepid_redis_data:/data
    restart: unless-stopped

volumes:
  intrepid_db_data:
  intrepid_redis_data:
