name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prisma generate
        run: pnpm --filter @intrepid/api prisma:generate

      - name: Lint
        run: pnpm lint

      - name: Typecheck API
        run: pnpm --filter @intrepid/api exec tsc -p tsconfig.json --noEmit

      - name: Typecheck Web
        run: pnpm --filter @intrepid/web exec tsc --noEmit
