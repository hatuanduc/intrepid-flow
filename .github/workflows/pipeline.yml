name: CI + Build Images

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
    paths:
      - 'apps/**'
      - 'prisma/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'docker-compose.local.yml'
      - '.github/workflows/pipeline.yml'

concurrency:
  group: pipeline-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  # ── Job 1: CI (lint + typecheck) ────────────────────────────────────────────
  check:
    name: Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prisma generate
        run: pnpm --filter @intrepid/api db:generate

      - name: Lint
        run: pnpm lint

      - name: Typecheck API
        run: pnpm --filter @intrepid/api exec tsc -p tsconfig.json --noEmit

      - name: Typecheck Web
        run: pnpm --filter @intrepid/web exec tsc --noEmit

      - name: Typecheck Reconcile Lambda
        run: pnpm --filter @intrepid/reconcile-lambda exec tsc -p tsconfig.json --noEmit

  # ── Job 2: Build & push images to GHCR ──────────────────────────────────────
  # Runs entirely on local Docker now (no AWS, no EC2 deploy) — docker-compose.local.yml
  # just pulls these by tag, so a fresh machine never needs to build from source itself.
  # Only builds on push (not on PRs) — PRs are covered by `check` above; images are tagged
  # both `latest` (what docker-compose.local.yml defaults to) and the commit SHA (for
  # pinning via IMAGE_TAG if you ever need to roll back).
  build-and-push:
    name: Build & push (${{ matrix.app }})
    runs-on: ubuntu-latest
    needs: check
    if: github.event_name == 'push'
    strategy:
      matrix:
        app: [api, web, worker]

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push intrepid-${{ matrix.app }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: true
          # NEXT_PUBLIC_* vars are baked into the web bundle at build time (see
          # apps/web/Dockerfile) — ignored for api/worker. Hardcoded here rather than a
          # repo Variable (not a secret either way — NEXT_PUBLIC_* ships to every browser
          # regardless of where it's stored): to change the domain or OAuth client later,
          # just edit the two values below and push — CI rebuilds, every host picks up
          # the new image on its next `docker compose pull`, no per-machine .env edit.
          #
          # NEXT_PUBLIC_API_BASE_URL=http://localhost:4000 for now — "localhost first, domain
          # later" phase (see HOSTING.md). This is baked server-side too (RootLayout reads
          # process.env.NEXT_PUBLIC_API_BASE_URL directly, Next.js inlines it build-time even
          # there), so setting API_BASE_URL at container runtime does NOT override it — confirmed
          # by testing directly against the pulled image. Only a rebuild actually changes this.
          # Switch back to the real domain here once Cloudflare Tunnel is set up.
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=http://localhost:4000
            NEXT_PUBLIC_GOOGLE_CLIENT_ID=571910582489-36mh98d21srspcqpmreaen68ccfg2fr3.apps.googleusercontent.com
          tags: |
            ghcr.io/${{ github.repository_owner }}/intrepid-${{ matrix.app }}:latest
            ghcr.io/${{ github.repository_owner }}/intrepid-${{ matrix.app }}:${{ github.sha }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/intrepid-${{ matrix.app }}:latest
          cache-to: type=inline
