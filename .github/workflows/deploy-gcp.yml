name: Deploy to GCP (Cloud Run)

on:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: ${{ secrets.GCP_REGION }}
  ARTIFACT_REPO: ${{ secrets.GCP_ARTIFACT_REPO }}
  TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
  GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Auth (Service Account Key)
        if: env.GCP_SA_KEY != ''
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ env.GCP_SA_KEY }}

      - name: Auth (Workload Identity Federation)
        if: env.GCP_SA_KEY == ''
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker auth
        run: gcloud auth configure-docker $REGION-docker.pkg.dev --quiet

      - name: Ensure Artifact Registry repo
        run: |
          ARTIFACT_REPO="${ARTIFACT_REPO:-intrepid}"
          if ! gcloud artifacts repositories describe "$ARTIFACT_REPO" --location "$REGION" >/dev/null 2>&1; then
            gcloud artifacts repositories create "$ARTIFACT_REPO" \
              --repository-format=docker \
              --location="$REGION" \
              --description="Docker images for intrepid"
          fi

      - name: Build & push images
        run: |
          ARTIFACT_REPO="${ARTIFACT_REPO:-intrepid}"
          API_IMAGE="$REGION-docker.pkg.dev/$PROJECT_ID/$ARTIFACT_REPO/intrepid-api:${GITHUB_SHA}"
          WEB_IMAGE="$REGION-docker.pkg.dev/$PROJECT_ID/$ARTIFACT_REPO/intrepid-web:${GITHUB_SHA}"

          echo "API_IMAGE=$API_IMAGE" >> $GITHUB_ENV
          echo "WEB_IMAGE=$WEB_IMAGE" >> $GITHUB_ENV

          docker build -f apps/api/Dockerfile -t "$API_IMAGE" .
          docker push "$API_IMAGE"

          docker build -f apps/web/Dockerfile -t "$WEB_IMAGE" .
          docker push "$WEB_IMAGE"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.5

      - name: Terraform init
        working-directory: infra/terraform
        run: |
          if [ -z "$TF_STATE_BUCKET" ]; then
            echo "Missing TF_STATE_BUCKET secret (GCS bucket for terraform state)." >&2
            exit 1
          fi

          terraform init \
            -backend-config="bucket=$TF_STATE_BUCKET" \
            -backend-config="prefix=intrepid"

      - name: Terraform apply
        working-directory: infra/terraform
        run: |
          terraform apply -auto-approve \
            -var="project_id=$PROJECT_ID" \
            -var="region=$REGION" \
            -var="artifact_repo=$ARTIFACT_REPO" \
            -var="api_image=$API_IMAGE" \
            -var="web_image=$WEB_IMAGE" \
            -var='api_env={PORT="4000",CORS_ORIGIN="${{ secrets.CORS_ORIGIN }}",JWT_SECRET="${{ secrets.JWT_SECRET }}",DEMO_PASSWORD="${{ secrets.DEMO_PASSWORD }}"}'
