name: AWS — Infra + Deploy

on:
  push:
    branches: [main, develop]
    paths:
      - 'apps/**'
      - 'prisma/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'docker-compose.prod.yml'
      - 'infra/aws/environments/**'
      - 'infra/aws/modules/**'
      - 'infra/aws/scripts/**'
  pull_request:
    branches: [main, develop]
    paths:
      - 'infra/aws/environments/**'
      - 'infra/aws/modules/**'
      - 'infra/aws/scripts/**'

concurrency:
  group: aws-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  TF_ENV:        ${{ (github.ref_name == 'main' || github.base_ref == 'main') && 'prod' || 'dev' }}
  AWS_REGION:    ap-southeast-1
  DEPLOY_BUCKET: intrepid-terraform-state
  AWS_ACCOUNT:   "735295721292"

jobs:
  # ── Job 1: Terraform ─────────────────────────────────────────────────────
  infra:
    name: Infra (${{ (github.ref_name == 'main' || github.base_ref == 'main') && 'prod' || 'dev' }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/aws/environments/${{ env.TF_ENV }}

    outputs:
      instance_id: ${{ steps.tf_output.outputs.instance_id }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT }}:role/intrepid-flow-infra-manager
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.8"
          terraform_wrapper: false

      - name: Terraform Init
        run: terraform init

      - name: Detect infra changes
        id: detect
        run: |
          CHANGED=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }})
          if echo "$CHANGED" | grep -qE '^infra/aws/(environments|modules|scripts)'; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No infra changes — skipping plan/apply"
          fi

      - name: Terraform Validate
        if: steps.detect.outputs.changed == 'true'
        run: terraform validate

      - name: Terraform Plan
        if: steps.detect.outputs.changed == 'true'
        run: terraform plan -out=tfplan

      - name: Terraform Apply
        if: steps.detect.outputs.changed == 'true' && github.event_name == 'push'
        run: terraform apply -auto-approve tfplan

      - name: Get EC2 instance ID
        id: tf_output
        run: echo "instance_id=$(terraform output -raw instance_id)" >> $GITHUB_OUTPUT

  # ── Job 2: Deploy ─────────────────────────────────────────────────────────
  deploy:
    name: Deploy (${{ github.ref_name == 'main' && 'prod' || 'dev' }})
    runs-on: ubuntu-latest
    needs: infra
    if: github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT }}:role/intrepid-flow-${{ env.TF_ENV }}-deploy-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload code to S3
        run: |
          tar czf /tmp/deploy.tar.gz \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='.next' \
            --exclude='dist' \
            --exclude='*.env*' \
            --exclude='.env*' \
            .

          aws s3 cp /tmp/deploy.tar.gz \
            s3://${{ env.DEPLOY_BUCKET }}/deploy/${{ env.TF_ENV }}/${{ github.sha }}.tar.gz

          echo "Uploaded $(du -sh /tmp/deploy.tar.gz | cut -f1) to S3"

      - name: Deploy via SSM Run Command
        run: |
          EC2_ID="${{ needs.infra.outputs.instance_id }}"
          SHA="${{ github.sha }}"
          BUCKET="${{ env.DEPLOY_BUCKET }}"
          TF_ENV="${{ env.TF_ENV }}"

          COMMAND_ID=$(aws ssm send-command \
            --region "${{ env.AWS_REGION }}" \
            --instance-ids "$EC2_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy $SHA ($TF_ENV)" \
            --timeout-seconds 1200 \
            --parameters "{\"commands\":[
              \"set -euo pipefail\",
              \"echo '=== Deploy $SHA ===' \",
              \"aws s3 cp s3://$BUCKET/deploy/$TF_ENV/$SHA.tar.gz /tmp/deploy.tar.gz\",
              \"find /app -mindepth 1 -maxdepth 1 -not -name '.env' -exec rm -rf {} +\",
              \"tar xzf /tmp/deploy.tar.gz -C /app\",
              \"APP_ENV=$TF_ENV AWS_DEFAULT_REGION=${{ env.AWS_REGION }} bash /app/infra/aws/scripts/deploy.sh\",
              \"echo '=== Done ==='\"
            ]}" \
            --output text \
            --query "Command.CommandId")

          echo "SSM Command ID: $COMMAND_ID"

          if ! aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_ID"; then
            echo "--- STDERR ---"
            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_ID" \
              --query StandardErrorContent --output text
            exit 1
          fi

          echo "--- Output ---"
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_ID" \
            --query StandardOutputContent --output text
