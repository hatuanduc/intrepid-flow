services:
  db:
    image: postgres:16-alpine
    container_name: intrepid_db
    environment:
      POSTGRES_USER: intrepid
      POSTGRES_PASSWORD: intrepid
      POSTGRES_DB: intrepid_dev
    ports:
      - "5433:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    restart: unless-stopped
